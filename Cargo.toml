[package]
name = "trestle"
version = "0.1.0"
edition = "2024"
description = "Trestle（栈架）— Local-first task handoff, delivery verification, and read-only workbench"
license = "MIT"

[lib]
name = "trestle"
path = "src/lib.rs"

[[bin]]
name = "wb"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
fastrand = "2.5.0"
libc = "0.2.191"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
url = "2.5.8"
